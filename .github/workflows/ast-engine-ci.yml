name: ast-engine-ci

on:
  push:
    paths: ["apps/ast-engine/**", ".github/workflows/ast-engine-ci.yml"]
  pull_request:
    paths: ["apps/ast-engine/**"]

defaults:
  run:
    working-directory: apps/ast-engine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ast-engine/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (Flake8 — theo SRS mục 8.5)
        run: python -m flake8 src tests
      - name: Unit test + coverage
        # Milestone 3 yêu cầu >= 80% trên module lõi: khi đó thêm --cov-fail-under=80
        run: python -m pytest --cov=ast_engine --cov-report=term-missing
