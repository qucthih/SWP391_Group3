version: '3.8'

services:
  # 1. Cơ sở dữ liệu Microsoft SQL Server 2019 (MSSQL) chuẩn SRS mục 8.1
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: aita_mssql
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "AitaPassword123!" # Yêu cầu mật khẩu mạnh của MSSQL
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # 2. Redis 7 Queue & Cache (BullMQ) chuẩn SRS mục 8.1
  redis:
    image: redis:7-alpine
    container_name: aita_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. AST Plagiarism Detection Engine (FastAPI - Phân hệ 4)
  ast-engine:
    build:
      context: ./apps/ast-engine
    container_name: aita_ast_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

volumes:
  mssql_data:
  redis_data:
